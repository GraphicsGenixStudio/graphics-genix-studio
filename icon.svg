    <path d="M104 168V112H160" stroke="#6caeff"/>
    <path d="M352 112H408V168" stroke="#dce6f3" stroke-opacity=".88"/>
    <path d="M408 344V400H352" stroke="#6caeff"/>
    <path d="M160 400H104V344" stroke="#dce6f3" stroke-opacity=".88"/>
  </g>
  <!-- Interlocking G ribbons: one continuous visual signature, not plain text. -->
  <path d="M242 188H197C165 188 143 210 143 242V271C143 303 165 325 197 325H225C251 325 267 309 267 284V264H218"
        fill="none" stroke="#070b11" stroke-opacity=".45" stroke-width="43" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 5)"/>
  <path d="M242 188H197C165 188 143 210 143 242V271C143 303 165 325 197 325H225C251 325 267 309 267 284V264H218"
        fill="none" stroke="url(#ice)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M270 324H315C347 324 369 302 369 270V241C369 209 347 187 315 187H287C261 187 245 203 245 228V248H294"
        fill="none" stroke="#070b11" stroke-opacity=".5" stroke-width="43" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 5)"/>
  <path d="M270 324H315C347 324 369 302 369 270V241C369 209 347 187 315 187H287C261 187 245 203 245 228V248H294"
        fill="none" stroke="url(#blue)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
