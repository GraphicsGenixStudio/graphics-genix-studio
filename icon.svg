<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Graphics Genix Studio mark">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202631"/>
      <stop offset="1" stop-color="#10141b"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd7e8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ec5ff"/>
      <stop offset=".55" stop-color="#438bff"/>
      <stop offset="1" stop-color="#2760c7"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed base: iOS applies its own icon mask. -->
  <rect width="512" height="512" fill="url(#base)"/>
  <path d="M0 0H512V512H0Z" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="2"/>
